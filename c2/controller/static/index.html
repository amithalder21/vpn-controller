<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VPN Fleet Control</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1b1f24; --muted: #667085; --line: #e3e6ea;
    --accent: #2f6fde; --ok: #1a7f4b; --warn: #b26b00; --bad: #c0362c; --code: #0f1419; --codetext: #d6dde6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1216; --panel: #171b21; --text: #e6e9ee; --muted: #8b95a3; --line: #2a3038;
            --accent: #5b8ff0; --ok: #3fb97a; --warn: #e0a03c; --bad: #ef6a5e; --code: #0a0d10; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 16px; margin: 0; }
  header .sp { flex: 1; }
  main { max-width: 1200px; margin: 0 auto; padding: 20px 16px; display: grid; gap: 18px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  h2 { font-size: 14px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  h2 .sp { flex: 1; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  td.mono, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger:hover { border-color: var(--bad); color: var(--bad); }
  button:disabled { opacity: .5; cursor: wait; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 1px solid currentColor; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); } .muted { color: var(--muted); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  textarea, input[type=text], input[type=password], input[type=number], select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; }
  textarea { width: 100%; min-height: 72px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  .results { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; margin-top: 12px; }
  .result { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
  .result .hd { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; font-size: 12.5px; border-bottom: 1px solid var(--line); }
  pre { margin: 0; padding: 10px; background: var(--code); color: var(--codetext); font-size: 12px; max-height: 340px; overflow: auto; white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, Menlo, monospace; }
  .actions { display: flex; gap: 4px; flex-wrap: wrap; }
  .table-wrap { overflow-x: auto; }
  #toast { position: fixed; bottom: 16px; right: 16px; max-width: 420px; padding: 10px 14px; border-radius: 8px; background: var(--text); color: var(--bg); display: none; white-space: pre-wrap; z-index: 20; }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>VPN Fleet Control</h1>
  <span class="sp"></span>
  <input id="token" type="password" placeholder="Control token" size="22" autocomplete="off">
  <button id="saveToken">Save token</button>
</header>
<main>
  <section>
    <h2>Workers <span class="sp"></span>
      <button data-bulk="start" class="primary">Start all</button>
      <button data-bulk="ip">Check all IPs</button>
      <button data-bulk="restart">Restart all</button>
      <button data-bulk="stop">Stop all</button>
      <button data-bulk="remove" class="danger">Remove all</button>
    </h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th><input type="checkbox" id="selAll"></th><th>Profile</th><th>Server</th><th>VPN</th><th>Exit IP</th><th>Location</th><th></th></tr></thead>
        <tbody id="workers"><tr><td colspan="7" class="muted">Loading…</td></tr></tbody>
      </table>
    </div>
    <div class="row" style="margin-top:12px">
      <label class="row">Add profiles: <input type="file" id="files" accept=".ovpn,.conf" multiple></label>
      <button id="upload">Upload</button>
    </div>
  </section>

  <section>
    <h2>Scripts &amp; commands <span class="sp"></span>
      <span class="muted" id="runTarget">target: selected workers</span>
    </h2>
    <div class="row" style="margin-bottom:10px">
      <select id="scriptSel"><option value="">— inline command below —</option></select>
      <button id="loadScript">Load</button>
      <button id="delScript" class="danger">Delete</button>
      <span class="sp" style="flex:1"></span>
      <label class="row">Upload .sh: <input type="file" id="shfiles" accept=".sh" multiple></label>
      <button id="uploadSh">Upload</button>
    </div>
    <textarea id="cmd" placeholder="#!/bin/sh&#10;curl -s https://ifconfig.co/json">curl -s https://ifconfig.co/country-iso</textarea>
    <div class="row" style="margin-top:8px">
      <button id="runSel" class="primary">Run on selected</button>
      <button id="runAll">Run on all running</button>
      <label class="row muted">timeout (s) <input id="timeout" type="number" value="300" min="1" max="3600" style="width:84px"></label>
      <span class="sp" style="flex:1"></span>
      <button id="saveAsScript">Save editor as .sh…</button>
    </div>
  </section>

  <section id="jobBox" style="display:none">
    <h2>Live job output <span class="tag" id="jobId"></span>
      <span class="sp"></span>
      <span id="jobState" class="muted"></span>
      <button id="jobStop">Stop stream</button>
      <button id="jobClose">Close</button>
    </h2>
    <div id="jobResults" class="results"></div>
  </section>

  <section id="logsBox" style="display:none">
    <h2>Live logs: <span id="logsName" class="mono"></span>
      <span class="sp"></span>
      <span id="logsState" class="muted"></span>
      <button id="closeLogs">Close</button>
    </h2>
    <pre id="logs"></pre>
  </section>
</main>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
let token = '';
try { token = localStorage.getItem('mvpn-token') || ''; } catch (e) {}
$('#token').value = token;

function toast(msg, ms = 4000) {
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', ms);
}

async function api(method, path, body, isForm) {
  const opts = { method, headers: { 'X-Token': token } };
  if (body && isForm) opts.body = body;
  else if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for (const k of kids) e.append(k instanceof Node ? k : document.createTextNode(k ?? ''));
  return e;
}

function vpnPill(w) {
  if (!w.exists) return el('span', { class: 'pill muted' }, 'not started');
  if (w.vpn !== 'running') return el('span', { class: 'pill bad' }, w.vpn || 'missing');
  const h = w.health;
  const cls = h === 'healthy' ? 'ok' : h === 'unhealthy' ? 'bad' : 'warn';
  return el('span', { class: 'pill ' + cls }, h || 'running');
}

let profiles = {}, selected = new Set();

async function refresh() {
  try {
    const [plist, workers] = await Promise.all([api('GET', '/api/profiles'), api('GET', '/api/workers')]);
    profiles = Object.fromEntries(plist.map(p => [p.name, p]));
    render(workers);
  } catch (e) {
    $('#workers').replaceChildren(el('tr', {}, el('td', { colspan: 7, class: 'bad' }, e.message)));
  }
}

function render(workers) {
  const tb = $('#workers');
  if (!workers.length) { tb.replaceChildren(el('tr', {}, el('td', { colspan: 7, class: 'muted' }, 'No profiles yet. Upload .ovpn files below.'))); return; }
  tb.replaceChildren(...workers.map(w => {
    const p = profiles[w.name] || {};
    const ip = w.ipinfo || {};
    const box = el('input', { type: 'checkbox' }); box.checked = selected.has(w.name);
    box.addEventListener('change', () => box.checked ? selected.add(w.name) : selected.delete(w.name));
    const act = (label, fn, cls = '') => el('button', { class: cls, onclick: async ev => {
      ev.target.disabled = true;
      try { await fn(); } catch (e) { toast(w.name + ': ' + e.message); }
      ev.target.disabled = false; refresh();
    } }, label);
    return el('tr', {},
      el('td', {}, box),
      el('td', { class: 'mono' }, w.name),
      el('td', { class: 'mono muted' }, `${p.remote || '?'} ${p.proto || ''}`),
      el('td', {}, vpnPill(w)),
      el('td', { class: 'mono' }, ip.ip || (ip.error ? '—' : '')),
      el('td', { class: ip.error ? 'bad' : '' }, ip.error ? ip.error.slice(0, 60) : [ip.city, ip.country].filter(Boolean).join(', ') + (ip.org ? ' · ' + ip.org : '')),
      el('td', {}, el('div', { class: 'actions' },
        w.exists && w.vpn === 'running'
          ? act('Stop', () => api('POST', `/api/workers/${w.name}/stop`))
          : act('Start', () => api('POST', `/api/workers/${w.name}/start`), 'primary'),
        act('Restart', () => api('POST', `/api/workers/${w.name}/restart`)),
        act('IP', () => api('POST', `/api/workers/${w.name}/ip`)),
        el('button', { onclick: () => streamLogs(w.name) }, 'Logs'),
        act('Remove', () => api('DELETE', `/api/workers/${w.name}`), 'danger'),
        act('Delete profile', () => confirm(`Delete profile ${w.name}?`) && api('DELETE', `/api/profiles/${w.name}`), 'danger'),
      )),
    );
  }));
}

/* ---- live container logs via SSE ---- */
let logSrc = null;
function streamLogs(name) {
  if (logSrc) logSrc.close();
  $('#logsName').textContent = name; $('#logs').textContent = '';
  $('#logsBox').style.display = ''; $('#logsState').textContent = 'connecting…';
  const src = new EventSource(`/api/workers/${name}/logs/stream?tail=200&token=${encodeURIComponent(token)}`);
  logSrc = src;
  src.onopen = () => $('#logsState').innerHTML = '<span class="dot" style="background:var(--ok)"></span>live';
  src.onmessage = ev => {
    const atBottom = $('#logs').scrollTop + $('#logs').clientHeight >= $('#logs').scrollHeight - 30;
    $('#logs').append(JSON.parse(ev.data).line);
    if (atBottom) $('#logs').scrollTop = 1e9;
  };
  src.onerror = () => { $('#logsState').innerHTML = '<span class="dot" style="background:var(--bad)"></span>disconnected'; };
}
$('#closeLogs').onclick = () => { if (logSrc) logSrc.close(); $('#logsBox').style.display = 'none'; };

/* ---- bulk worker actions ---- */
document.querySelectorAll('[data-bulk]').forEach(b => b.addEventListener('click', async () => {
  const action = b.dataset.bulk;
  if (action === 'remove' && !confirm('Remove all worker containers? Profiles are kept.')) return;
  b.disabled = true;
  try {
    const r = await api('POST', `/api/bulk/${action}`, {});
    const errs = Object.entries(r).filter(([, v]) => v && v.error && action !== 'ip');
    toast(errs.length ? errs.map(([k, v]) => `${k}: ${v.error}`).join('\n') : `${action}: done (${Object.keys(r).length})`);
  } catch (e) { toast(e.message); }
  b.disabled = false; refresh();
}));

$('#selAll').addEventListener('change', e => {
  selected = e.target.checked ? new Set(Object.keys(profiles)) : new Set(); refresh();
});

$('#upload').onclick = async () => {
  const files = $('#files').files;
  if (!files.length) return toast('Choose .ovpn files first');
  const fd = new FormData(); for (const f of files) fd.append('files', f);
  try { const r = await api('POST', '/api/profiles', fd, true); toast('Uploaded: ' + r.saved.join(', ')); $('#files').value = ''; }
  catch (e) { toast(e.message); }
  refresh();
};

/* ---- scripts ---- */
async function refreshScripts() {
  try {
    const list = await api('GET', '/api/scripts');
    const sel = $('#scriptSel'); const cur = sel.value;
    sel.replaceChildren(el('option', { value: '' }, '— inline command below —'),
      ...list.map(n => el('option', { value: n }, n)));
    sel.value = cur;
  } catch (e) {}
}
$('#uploadSh').onclick = async () => {
  const files = $('#shfiles').files;
  if (!files.length) return toast('Choose .sh files first');
  const fd = new FormData(); for (const f of files) fd.append('files', f);
  try { const r = await api('POST', '/api/scripts', fd, true); toast('Uploaded: ' + r.saved.join(', ')); $('#shfiles').value = ''; }
  catch (e) { toast(e.message); }
  refreshScripts();
};
$('#loadScript').onclick = async () => {
  const name = $('#scriptSel').value;
  if (!name) return toast('Pick a script to load');
  try { const r = await api('GET', `/api/scripts/${name}`); $('#cmd').value = r.body; toast('Loaded ' + name); }
  catch (e) { toast(e.message); }
};
$('#delScript').onclick = async () => {
  const name = $('#scriptSel').value;
  if (!name) return toast('Pick a script to delete');
  if (!confirm(`Delete script ${name}?`)) return;
  try { await api('DELETE', `/api/scripts/${name}`); toast('Deleted ' + name); } catch (e) { toast(e.message); }
  refreshScripts();
};
$('#saveAsScript').onclick = async () => {
  let name = prompt('Save editor contents as which .sh file?', 'script.sh');
  if (!name) return;
  if (!name.endsWith('.sh')) name += '.sh';
  const fd = new FormData();
  fd.append('files', new File([$('#cmd').value], name, { type: 'text/x-shellscript' }));
  try { await api('POST', '/api/scripts', fd, true); toast('Saved ' + name); } catch (e) { toast(e.message); }
  refreshScripts();
};

/* ---- run a streaming job ---- */
let jobSrc = null, jobPanes = {};
function startJob(targets) {
  const scriptName = $('#scriptSel').value;
  const payload = { targets, timeout: +$('#timeout').value || 300 };
  if (scriptName) payload.script = scriptName;
  else {
    const bodyText = $('#cmd').value.trim();
    if (!bodyText) return toast('Enter a command or pick a script');
    payload.body = bodyText;
  }
  if (Array.isArray(targets) && !targets.length) return toast('Select at least one worker');
  api('POST', '/api/run', payload).then(r => openJob(r.job, r.targets)).catch(e => toast(e.message));
}
function openJob(jobId, targets) {
  if (jobSrc) jobSrc.close();
  jobPanes = {};
  $('#jobId').textContent = jobId;
  $('#jobBox').style.display = '';
  $('#jobState').innerHTML = '<span class="dot" style="background:var(--warn)"></span>running';
  const grid = $('#jobResults'); grid.replaceChildren();
  for (const name of targets) {
    const pre = el('pre', {});
    const state = el('span', { class: 'muted' }, '…');
    grid.append(el('div', { class: 'result' },
      el('div', { class: 'hd' }, el('b', { class: 'mono' }, name), state), pre));
    jobPanes[name] = { pre, state };
  }
  const src = new EventSource(`/api/jobs/${jobId}/stream?token=${encodeURIComponent(token)}`);
  jobSrc = src;
  src.onmessage = ev => {
    const d = JSON.parse(ev.data);
    if (d.event === 'done') { $('#jobState').innerHTML = '<span class="dot" style="background:var(--ok)"></span>finished'; src.close(); return; }
    if (d.event === 'start') return;
    const pane = jobPanes[d.worker]; if (!pane) return;
    if (d.event === 'exit') {
      const ok = d.code === '0';
      pane.state.className = ok ? 'ok' : 'bad';
      pane.state.textContent = d.code === '124' ? 'timed out' : `exit ${d.code}`;
      if (d.line) pane.pre.append(d.line);
      return;
    }
    if (d.line !== undefined) {
      const atBottom = pane.pre.scrollTop + pane.pre.clientHeight >= pane.pre.scrollHeight - 30;
      pane.pre.append(d.line);
      if (atBottom) pane.pre.scrollTop = 1e9;
    }
  };
  src.onerror = () => { $('#jobState').innerHTML = '<span class="dot" style="background:var(--bad)"></span>stream error'; };
}
$('#runSel').onclick = () => startJob([...selected]);
$('#runAll').onclick = () => startJob('all');
$('#jobStop').onclick = () => { if (jobSrc) jobSrc.close(); $('#jobState').textContent = 'stopped (job keeps running on server)'; };
$('#jobClose').onclick = () => { if (jobSrc) jobSrc.close(); $('#jobBox').style.display = 'none'; };

$('#scriptSel').addEventListener('change', e => {
  $('#runTarget').textContent = e.target.value ? `will run saved script: ${e.target.value}` : 'target: selected workers';
});

$('#saveToken').onclick = () => {
  token = $('#token').value.trim();
  try { localStorage.setItem('mvpn-token', token); } catch (e) {}
  refresh(); refreshScripts();
};

refresh();
refreshScripts();
setInterval(refresh, 5000);
</script>
</body>
</html>
