# VPN fleet controller + DragonflyDB streaming bus.
# Workers (one gluetun + one app container per .ovpn profile) are created at
# runtime by the controller, not listed here.
#
# The controller mounts the Docker socket, which is equivalent to root on the
# host: keep it on localhost or behind a strong CONTROL_TOKEN.

services:
  # Builds the worker app image (bash + tools). It runs `true` and exits;
  # the controller creates the real app containers from this image.
  worker-app:
    build: ./worker-app
    image: mvpn-worker-app:latest
    entrypoint: ["true"]
    restart: "no"

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    restart: unless-stopped
    command: ["--logtostderr", "--default_lua_flags=allow-undeclared-keys"]
    ulimits:
      memlock: -1
    volumes:
      - dragonfly:/data
    networks: [mvpn]
    # no ports published; only the controller talks to it over the mvpn network

  controller:
    build:
      context: .
      dockerfile: controller/Dockerfile
    restart: unless-stopped
    depends_on: [dragonfly]
    ports:
      - "127.0.0.1:8088:8080"
      # round-robin proxy front (one endpoint, rotates across healthy exits).
      # Per-exit proxy ports are published dynamically by each exit on 127.0.0.1.
      - "127.0.0.1:18080:18080"
    environment:
      CONTROL_TOKEN: ${CONTROL_TOKEN:?set CONTROL_TOKEN in .env}
      REDIS_URL: redis://dragonfly:6379/0
      PROFILES_VOLUME: mvpn-profiles
      SCRIPTS_VOLUME: mvpn-scripts
      APP_IMAGE: mvpn-worker-app:latest
      WORKER_NETWORK: mvpn-net
      TZ: Asia/Kolkata
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - profiles:/profiles
      - scripts:/scripts
      # The UI is built into the image (see controller/Dockerfile). For UI dev,
      # run `cd web && npm run dev` (Vite dev server proxies /api to :8088).
    networks: [mvpn]

volumes:
  profiles:
    name: mvpn-profiles
  scripts:
    name: mvpn-scripts
  dragonfly:
    name: mvpn-dragonfly

networks:
  mvpn:
    name: mvpn-net
